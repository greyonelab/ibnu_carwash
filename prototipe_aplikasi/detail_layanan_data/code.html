<body class="bg-background text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 shadow-[0px_1px_3px_rgba(15,23,42,0.08)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-50" data-icon="local_car_wash">local_car_wash</span>
<h1 class="font-inter text-xl font-black text-slate-900 dark:text-white uppercase tracking-wider">Wash Admin</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="professional headshot of a service manager in a clean uniform with a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrvXKI7fba-nFNZK8lXG9xJBv2lKHr_gaky3QwC64bD399ylKtXZofnV5qeSCNbqmzKH8vAmDPKjhSEQvKy-xrTsDGFRuzbCwleF6i9SW-y57NpDgmmVNBxbS3ZSAL4aJaqg4Y8TrJcDV3DU5SgNvwjZcXqdQ4zJpExkCOk0Piksr1qDiwsWtpd8ZijIFvVXBUiSiVxo3woNMUF-CLRhu8T9jVHdmZZZRK-Ads2jkbGMM71vpnkj4JGa1MftPjzmX-dyzW5h3I_1k"/>
</div>
</header>
<main class="pt-24 pb-32 px-md max-w-2xl mx-auto">
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-lg px-base">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-white text-label-md">1</div>
<span class="text-label-md mt-2 text-on-surface-variant">Kendaraan</span>
</div>
<div class="h-px flex-1 bg-secondary mx-4 mb-5"></div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-white text-label-md">2</div>
<span class="text-label-md mt-2 text-secondary font-bold">Detail</span>
</div>
<div class="h-px flex-1 bg-surface-container-highest mx-4 mb-5"></div>
<div class="flex flex-col items-center opacity-40">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant text-label-md">3</div>
<span class="text-label-md mt-2 text-on-surface-variant">Konfirmasi</span>
</div>
</div>
<div class="mb-lg">
<h2 class="font-h2 text-h2 text-on-surface mb-xs">Detail Layanan &amp; Data</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Lengkapi informasi untuk melanjutkan transaksi cuci baru.</p>
</div>
<form class="space-y-lg">
<!-- Service Selection -->
<section>
<label class="font-label-md text-label-md text-on-surface-variant block mb-sm">PILIH JENIS LAYANAN</label>
<div class="grid grid-cols-1 md:grid-cols-3 gap-sm">
<!-- Standard -->
<label class="relative flex flex-col p-md border border-outline-variant rounded-xl cursor-pointer hover:bg-white transition-colors group">
<input checked="" class="absolute top-4 right-4 text-secondary focus:ring-secondary" name="service" type="radio"/>
<span class="material-symbols-outlined text-secondary mb-xs" data-icon="water_drop">water_drop</span>
<span class="font-h3 text-body-lg font-bold block">Standar</span>
<span class="font-body-md text-label-md text-on-surface-variant mt-1">Cuci luar &amp; vakum dasar</span>
<span class="mt-md font-stats-num text-stats-num text-secondary">Rp 50k</span>
</label>
<!-- Premium -->
<label class="relative flex flex-col p-md border border-outline-variant rounded-xl cursor-pointer hover:bg-white transition-colors group">
<input class="absolute top-4 right-4 text-secondary focus:ring-secondary" name="service" type="radio"/>
<span class="material-symbols-outlined text-secondary mb-xs" data-icon="auto_awesome">auto_awesome</span>
<span class="font-h3 text-body-lg font-bold block">Premium</span>
<span class="font-body-md text-label-md text-on-surface-variant mt-1">Wax, semir ban &amp; interior</span>
<span class="mt-md font-stats-num text-stats-num text-secondary">Rp 85k</span>
</label>
<!-- Full Detail -->
<label class="relative flex flex-col p-md border border-outline-variant rounded-xl cursor-pointer hover:bg-white transition-colors group">
<input class="absolute top-4 right-4 text-secondary focus:ring-secondary" name="service" type="radio"/>
<span class="material-symbols-outlined text-secondary mb-xs" data-icon="cleaning_services">cleaning_services</span>
<span class="font-h3 text-body-lg font-bold block">Detail Lengkap</span>
<span class="font-body-md text-label-md text-on-surface-variant mt-1">Pembersihan mesin &amp; kerak</span>
<span class="mt-md font-stats-num text-stats-num text-secondary">Rp 150k</span>
</label>
</div>
</section>
<!-- Input Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md bg-white p-md rounded-xl border border-outline-variant shadow-[0px_1px_3px_rgba(15,23,42,0.08)]">
<div class="col-span-1 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant block mb-2 uppercase">Plat Nomor</label>
<input class="w-full h-12 px-4 border border-outline-variant rounded-lg font-h2 text-h2 tracking-widest uppercase focus:border-secondary focus:ring-1 focus:ring-secondary bg-surface transition-all" placeholder="Contoh: B 1234 ABC" type="text"/>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-2 uppercase">Jenis/Model Kendaraan</label>
<div class="relative">
<input class="w-full h-12 px-4 border border-outline-variant rounded-lg font-body-md text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary bg-surface" placeholder="Contoh: Honda CR-V White" type="text"/>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-2 uppercase">Nama Petugas/Staff</label>
<select class="w-full h-12 px-4 border border-outline-variant rounded-lg font-body-md text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary bg-surface appearance-none">
<option value="">Pilih Petugas</option>
<option>Ahmad Subarjo</option>
<option>Budi Santoso</option>
<option>Dedi Kurniawan</option>
</select>
</div>
</div>
<!-- Actions -->
<div class="flex items-center gap-sm pt-md">
<button class="flex-1 h-12 border border-outline text-on-surface font-label-md rounded-lg hover:bg-slate-50 transition-colors" type="button">KEMBALI</button>
<button class="flex-[2] h-12 bg-secondary text-white font-label-md rounded-lg shadow-md active:scale-95 transition-all" type="submit">LANJUT KE KONFIRMASI</button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-white dark:bg-slate-950 px-4 pb-safe border-t border-slate-200 dark:border-slate-800">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-slate-100 transition-all">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-wide">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 font-bold scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-wide">New Wash</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-slate-100 transition-all">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-wide">Activity</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-slate-100 transition-all">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-inter text-[11px] font-medium uppercase tracking-wide">Settings</span>
</div>
</nav>
</body></html>
